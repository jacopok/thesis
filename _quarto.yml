
bibliography: rehear.bib

format:
  html:
    theme: 
      light:
        cosmo
      dark:
        [cosmo, theme_dark.css]
    embed-resources: false
    filters: 
      - pdf-to-webp.lua
    reference-location: margin
    # citation-location: margin
  pdf:
    documentclass: scrreprt
    colorlinks: true
    linkcolor: blue
    link-citations: true
    thanks: "Supervisor: Jan Harms"
    reference-section-title: "References"
    pdf-engine: xelatex
    include-in-header:
      text: |
        %\usepackage{unicode-math,polyglossia}
        %\usepackage[sups,osf]{fbb}
        \usepackage[scaled=.95]{cabin} 
        \usepackage[varqu,varl]{inconsolata} 
        %\usepackage{mathpazo}


execute:
  cache: true
  warning: false

csl: bibstyle.csl
