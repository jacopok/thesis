[project]
name = "thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "astropy>=5.3.2",
    "cartopy>=0.23.0",
    "cmcrameri>=1.9",
    "dynesty>=2.1.4",
    "emcee>=3.1.6",
    "getdist>=1.5.4",
    "gw-frequencies>=0.1.1",
    "gwfish",
    "h5py>=3.12.1",
    "hypothesis>=6.128.2",
    "ipyleaflet>=0.19.2",
    "jupyter-cache>=1.0.1",
    "jupyter>=1.1.1",
    "lalsuite>=7.24",
    "lunarsky>=0.2.1",
    "matplotlib>=3.9.2",
    "numpy>=1.26.4",
    "pandas>=1.4.1",
    "pytest>=8.3.5",
    "quarto-cli>=1.5.57",
    "scipy>=1.13.1",
    "thesis-scripts",
    "tqdm>=4.67.1",
]

[tool.uv.workspace]
members = ["thesis_scripts/thesis_scripts"]

[tool.uv.sources]
thesis-scripts = { path = "thesis_scripts", editable = true }
gwfish = { path = "../Documents/GWFish" }

